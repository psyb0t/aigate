# Groq namespaced these two under groq/ upstream. The doubled prefix is
# intentional: the first groq/ selects the provider, the second is part of the
# model id. The unprefixed ids no longer resolve.
- model_name: groq-compound
  litellm_params:
    model: groq/groq/compound
    api_key: os.environ/GROQ_API_KEY

