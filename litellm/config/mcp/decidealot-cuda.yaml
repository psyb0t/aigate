decidealot_cuda:
  url: "http://decidealot-cuda:8080/mcp"
  transport: "http"
  auth_type: "bearer_token"
  auth_value: os.environ/DECIDEALOT_AUTH_TOKEN
  description: "NVIDIA GPU variant of decidealot. It exposes system_one, system_one_batch, list_models, and unload_models. Local models use CUDA; optional hosted Jev uses TypeSafe's API and does not load a local model. Both variants share ${DATA_DIR_DECIDEALOT}/models. Tools are namespaced as `decidealot_cuda-<tool>` in the aggregated /mcp/."
