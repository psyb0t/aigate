mailbox:
  url: "http://mailbox:8000/mcp"
  transport: "http"
  auth_type: "bearer_token"
  auth_value: os.environ/MAILBOX_AUTH_TOKEN
  description: "Email gateway over IMAP+SMTP across configured mailboxes. Tools use a mailbox name or address and are filtered by token scopes. Supports inbox, message search and headers, replies, drafts, attachments, threads, identities, labels, moves, send guards and an audit log. Reads do not mark mail seen; delete moves mail to Trash. SQLite state persists across restarts."
