decidealot:
  url: "http://decidealot:8080/mcp"
  transport: "http"
  auth_type: "bearer_token"
  auth_value: os.environ/DECIDEALOT_AUTH_TOKEN
  description: "Typed decisions with local Laya, Von, CLM, and hosted TypeSafe Jev. All local providers are enabled by default. CLM uses AIGate's internal Qwen3-8B embeddings route. system_one evaluates one model, state, and named choice, score, or noul questions. system_one_batch evaluates independent complete requests and returns results in input order. list_models returns enabled local selectors and the live hosted Jev catalog for the configured TypeSafe account. unload_models releases resident local model memory. Answers include probabilities; the caller sets its own threshold."
